<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top of the page -->
  <header>
    <h1>Habit Tracker</h1>
    <p id="todayDate"></p>
  </header>

  <main>

    <!-- Progress section -->
    <section class="card" id="progressSection">
      <h2>Today's Progress</h2>
      <p id="progressText">0 of 0 habits done</p>
      <div class="bar">
        <div class="bar-fill" id="progressFill"></div>
      </div>
    </section>

    <!-- Form to add / edit a habit -->
    <section class="card">
      <h2 id="formTitle">Add Habit</h2>

      <form id="habitForm">
        <label for="habitName">Habit name</label>
        <input type="text" id="habitName" placeholder="e.g. Drink water">

        <label for="habitCategory">Category</label>
        <select id="habitCategory">
          <option value="">-- Select category --</option>
          <option value="Health">Health</option>
          <option value="Study">Study</option>
          <option value="Fitness">Fitness</option>
          <option value="Other">Other</option>
        </select>

        <p id="errorMessage"></p>

        <button type="submit" id="saveButton">Add Habit</button>
        <button type="button" id="cancelButton" class="grey" hidden>Cancel</button>
      </form>
    </section>

    <!-- Search and filter -->
    <section class="card">
      <h2>Search &amp; Filter</h2>
      <div class="filters">
        <div>
          <label for="searchInput">Search</label>
          <input type="text" id="searchInput" placeholder="Search habits...">
        </div>
        <div>
          <label for="statusFilter">Status</label>
          <select id="statusFilter">
            <option value="all">All</option>
            <option value="done">Done today</option>
            <option value="notdone">Not done today</option>
          </select>
        </div>
        <div>
          <label for="categoryFilter">Category</label>
          <select id="categoryFilter">
            <option value="all">All</option>
            <option value="Health">Health</option>
            <option value="Study">Study</option>
            <option value="Fitness">Fitness</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
    </section>

    <!-- List of habits -->
    <section>
      <h2>My Habits</h2>
      <p id="emptyMessage"></p>
      <ul id="habitList"></ul>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
